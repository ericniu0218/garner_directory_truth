[project]
name = "directory-truth"
version = "0.1.0"
description = "Scores which provider directory listings are probably stale"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dlt[postgres,filesystem]>=1.5",
    "dbt-postgres>=1.8",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "requests>=2.32",
    "anthropic>=0.40",
    "s3fs>=2024.6",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["directory_truth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
