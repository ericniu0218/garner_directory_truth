# Directory Truth on Kubernetes (written for a local `kind` cluster).
# Not yet applied to a cluster: kubectl/kind were not available when this was written.
#
#   kind create cluster --name directory-truth
#   docker build -f Dockerfile.api -t directory-truth-api:dev . && kind load docker-image directory-truth-api:dev --name directory-truth
#   docker build -f Dockerfile.pipeline -t directory-truth-pipeline:dev . && kind load docker-image directory-truth-pipeline:dev --name directory-truth
#   kubectl apply -f deploy/k8s/directory-truth.yaml
#   kubectl -n directory-truth create job first-run --from=cronjob/pipeline
#   kubectl -n directory-truth port-forward svc/api 8080:80
apiVersion: v1
kind: Namespace
metadata:
  name: directory-truth
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: directory-truth
type: Opaque
stringData:
  # Development values only. Use a real secret manager outside a laptop.
  POSTGRES_USER: dt
  POSTGRES_PASSWORD: dt
  POSTGRES_DB: directory_truth
  DATABASE_URL: postgresql://dt:dt@postgres:5432/directory_truth
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: directory-truth
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: directory-truth
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom: [{ secretRef: { name: postgres } }]
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "dt", "-d", "directory_truth"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: directory-truth
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: directory-truth-api:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres, key: DATABASE_URL } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: anthropic, key: api-key, optional: true } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: directory-truth
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 8080 }]
---
# The whole pipeline as one weekly job. Airflow (docker-compose) runs the same
# steps as separate tasks; this is the simpler option inside the cluster.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline
  namespace: directory-truth
spec:
  schedule: "0 6 * * 1"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pipeline
              image: directory-truth-pipeline:dev
              imagePullPolicy: IfNotPresent
              env:
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: postgres, key: DATABASE_URL } }
                - { name: DT_PG_HOST, value: postgres }
                - { name: DT_PG_PORT, value: "5432" }
                - { name: RAW_URL, value: "file:///data/raw" }
              resources:
                requests: { cpu: 500m, memory: 1Gi }
                limits: { memory: 4Gi }
              volumeMounts: [{ name: raw, mountPath: /data }]
          volumes:
            - name: raw
              emptyDir: {}
